name: Audit episodes with RSS

# One-shot audit: fetches the Anchor RSS in CI (where it's reachable),
# cross-references every src/content/episodes/*.mdx against it, and
# writes the enhanced audit report + raw RSS snapshot back to main.
#
# Triggered manually via workflow_dispatch.

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/audit-with-rss.mjs'
      - '.github/workflows/audit-with-rss.yml'

permissions:
  contents: write

concurrency:
  group: audit-with-rss
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm install --no-audit --no-fund

      - name: Run audit
        run: node scripts/audit-with-rss.mjs

      - name: Commit results back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rss-snapshot.json docs/episode-audit-rss.md
          if ! git diff --cached --quiet; then
            git commit -m "Audit: refresh episode-audit-rss + rss-snapshot from Anchor RSS"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }} 2>&1 | head -3; then break; fi
              git fetch origin ${{ github.ref_name }} --quiet || true
              git rebase --autostash origin/${{ github.ref_name }} --quiet || true
              sleep $((attempt * 3))
            done
          fi

      - name: Surface in job summary
        if: always()
        run: |
          if [ -f docs/episode-audit-rss.md ]; then
            cat docs/episode-audit-rss.md >> $GITHUB_STEP_SUMMARY
          fi
