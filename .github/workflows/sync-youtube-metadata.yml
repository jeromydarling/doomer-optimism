name: Sync YouTube metadata

# One-time backfill: copy YouTube titles + descriptions onto every
# episode MDX. Per Ashley's production doc — she found typos/inaccuracies
# and wants the site to mirror what's published on YouTube so she doesn't
# have to cross-check episode by episode.
#
# Cost: ~30 YouTube Data API calls per run. Free quota is 10,000/day.
# Re-runnable: idempotent (only writes when fields actually differ).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (print changes, don't write)"
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      only:
        description: "Comma-separated episode numbers to limit to (blank = all)"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sync-youtube-metadata
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm install --no-audit --no-fund

      - name: Run sync
        env:
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.only }}" ]; then
            ARGS="$ARGS --only=${{ github.event.inputs.only }}"
          fi
          node scripts/sync-youtube-metadata.mjs $ARGS

      - name: Commit changes back
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/episodes/
          if ! git diff --cached --quiet; then
            git commit -m "Sync episode titles + descriptions from YouTube"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }} 2>&1 | head -3; then break; fi
              git fetch origin ${{ github.ref_name }} --quiet || true
              git rebase --autostash origin/${{ github.ref_name }} --quiet || true
              sleep $((attempt * 3))
            done
          fi
