name: Backfill transcripts

on:
  workflow_dispatch:
    inputs:
      feed:
        description: 'Podcast RSS feed URL'
        required: false
        default: 'https://anchor.fm/s/68308b7c/podcast/rss'
      max:
        description: 'Max episodes to process'
        required: false
        default: '500'
      only:
        description: 'Single episode guid or slug (overrides max). Leave blank for batch.'
        required: false
        default: ''
      dry_run:
        description: 'List episodes only — no downloads, no API calls'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: transcript-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Transcribe & open PR
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Restore transcript cache
        uses: actions/cache@v4
        with:
          path: |
            .transcripts
          key: transcripts-${{ github.run_id }}
          restore-keys: |
            transcripts-

      - name: Run backfill
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--feed '${{ github.event.inputs.feed }}' --max ${{ github.event.inputs.max }}"
          if [ "${{ github.event.inputs.only }}" != "" ]; then
            ARGS="$ARGS --only '${{ github.event.inputs.only }}'"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: node scripts/transcribe-backfill.mjs $ARGS"
          eval node scripts/transcribe-backfill.mjs $ARGS

      - name: Save transcript cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .transcripts
          key: transcripts-${{ github.run_id }}

      - name: Open pull request
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: claude/transcripts-backfill
          base: main
          commit-message: 'Transcripts backfill via ElevenLabs Scribe + Claude Haiku'
          title: 'Transcripts backfill (${{ github.event.inputs.max }} episodes)'
          body: |
            Auto-generated transcripts batch.

            - Source: `${{ github.event.inputs.feed }}`
            - Max processed: `${{ github.event.inputs.max }}`
            - Engine: ElevenLabs Scribe (transcription + diarization) + Claude Haiku 4.5 (chapters, topics, bibliography, summary, pillar suggestion, pull quotes)
            - Speaker mapping: longest-talker → Ashley Colby Fitzgerald; second → guest from title

            New episodes are flagged `draft: true` — review and flip the flag (or
            delete the field) before they go public. The suggested pillar from
            Haiku is heuristic; please confirm.

            Existing curated episodes had only their `## Transcript`, `## Chapters`,
            and `## Pull quotes` sections appended; their summaries and
            bibliographies were preserved untouched.
          add-paths: |
            src/content/episodes/**
            .transcripts/**
