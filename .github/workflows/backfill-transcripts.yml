name: Backfill transcripts

on:
  workflow_dispatch:
    inputs:
      feed:
        description: 'Podcast RSS feed URL'
        required: false
        default: 'https://anchor.fm/s/68308b7c/podcast/rss'
      max:
        description: 'Max episodes to process'
        required: false
        default: '500'
      only:
        description: 'Single episode guid or slug (overrides max). Leave blank for batch.'
        required: false
        default: ''
      limit_new:
        description: 'Cap on FRESH transcriptions per run (cached episodes don''t count). 0 = no cap.'
        required: false
        default: '0'
      dry_run:
        description: 'List episodes only — no downloads, no API calls'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: transcript-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Transcribe & open PR
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to fetch the PR branch below

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Switch to claude/transcripts-backfill (so checkpoint pushes stack)
        run: |
          set -e
          BRANCH="claude/transcripts-backfill"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "On existing branch $BRANCH at $(git rev-parse --short HEAD)"
          else
            git checkout -B "$BRANCH"
            echo "Created new branch $BRANCH from main"
          fi
          SCRIBE=$(ls .transcripts/*.scribe.json 2>/dev/null | wc -l | tr -d ' ')
          ENRICH=$(ls .transcripts/enriched/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "Starting with $SCRIBE scribe.json files, $ENRICH enriched.json files cached."

      # Durable transcript storage. Now lives entirely on the PR branch:
      # the script itself git-pushes every freshly-written .scribe.json
      # immediately after Scribe returns. A 6h-cap kill therefore loses
      # at most the one in-flight episode. Belt-and-suspenders: the
      # always-snapshot step further down also captures .transcripts/
      # as a workflow artifact, recoverable from the workflow run page.
      - name: Restore .transcripts from PR branch (no-op if already on branch)
        run: |
          SCRIBE=$(ls .transcripts/*.scribe.json 2>/dev/null | wc -l | tr -d ' ')
          echo "Restored: $SCRIBE scribe.json files"

      - name: Run backfill
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Tells the script to git-push each finished scribe.json
          # immediately. Locally (no GITHUB_ACTIONS env var) the script
          # is a normal write-and-keep-going.
          CHECKPOINT_PUSH: '1'
        run: |
          ARGS="--feed '${{ github.event.inputs.feed }}' --max ${{ github.event.inputs.max }}"
          if [ "${{ github.event.inputs.only }}" != "" ]; then
            ARGS="$ARGS --only '${{ github.event.inputs.only }}'"
          fi
          if [ "${{ github.event.inputs.limit_new }}" != "0" ] && [ -n "${{ github.event.inputs.limit_new }}" ]; then
            ARGS="$ARGS --limit-new ${{ github.event.inputs.limit_new }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: node scripts/transcribe-backfill.mjs $ARGS"
          eval node scripts/transcribe-backfill.mjs $ARGS

      # Critical safety net: even if every other step fails or the job
      # is cancelled by the 6h cap, this `if: always()` step runs
      # during GHA's post-cancel cleanup window and uploads .transcripts/
      # as a workflow artifact. Recoverable for 30 days from the run
      # page even when peter-evans never gets to fire.
      - name: Snapshot .transcripts/ as workflow artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ github.run_id }}
          path: .transcripts/
          retention-days: 30
          if-no-files-found: warn

      - name: Open pull request
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: claude/transcripts-backfill
          base: main
          commit-message: 'Transcripts backfill via ElevenLabs Scribe + Claude Haiku'
          title: 'Transcripts backfill (${{ github.event.inputs.max }} episodes)'
          body: |
            Auto-generated transcripts batch.

            - Source: `${{ github.event.inputs.feed }}`
            - Max processed: `${{ github.event.inputs.max }}`
            - Engine: ElevenLabs Scribe (transcription + diarization) + Claude Haiku 4.5 (chapters, topics, bibliography, summary, pillar suggestion, pull quotes)
            - Speaker mapping: longest-talker → Ashley Colby Fitzgerald; second → guest from title

            New episodes are flagged `draft: true` — review and flip the flag (or
            delete the field) before they go public. The suggested pillar from
            Haiku is heuristic; please confirm.

            Existing curated episodes had only their `## Transcript`, `## Chapters`,
            and `## Pull quotes` sections appended; their summaries and
            bibliographies were preserved untouched.

            The .transcripts/ JSON files are committed to this branch so future
            re-runs of this workflow restore them automatically and don't
            re-spend on transcription.
          add-paths: |
            src/content/episodes/**
            .transcripts/**
